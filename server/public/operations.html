<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HerbChain operations</title>
<style>body{font:16px system-ui;background:#f5f7f0;color:#183d2b;margin:0}main{max-width:820px;margin:32px auto;padding:22px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #839b8e;border-radius:8px;box-sizing:border-box;max-width:100%}input:not([type=checkbox]),textarea{width:100%}button{background:#183d2b;color:white;cursor:pointer;margin:8px 0}button:disabled{opacity:.5}label{display:block;margin:16px 0 6px}section{margin:24px 0}pre,#message{white-space:pre-wrap;overflow-wrap:anywhere}pre{background:white;padding:16px}textarea{min-height:120px}[hidden]{display:none!important}nav a{margin-right:20px}</style>
<main><small>HERBCHAIN</small><h1>Lab and supply operations</h1><nav><a href="/custody">Custody handoffs</a><a href="/review">Harvest review</a><a href="/trace">Consumer trace</a></nav>
<form id="login"><label for="email">Participant email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form>
<p id="message" role="status" aria-live="polite"></p><section id="account" hidden><p id="identity"></p><button id="logout">Sign out</button><label for="batchId">Batch ID</label><input id="batchId"><button id="load">Load current ledger record</button></section>
<section id="recovery" hidden><h2>Saved request</h2><p id="pendingInfo"></p><button id="retry">Check or retry saved request</button><button id="clear">Clear local retry reference</button></section>
<section id="detail" hidden><h2 id="title"></h2><p id="status"></p><p id="availability"></p><form id="operation" hidden><fieldset id="fields"><legend>Record an operation</legend><label for="action">Action</label><select id="action"></select><div id="labFields"><label for="outcome">Lab outcome</label><select id="outcome"><option value="">Choose outcome</option><option value="PASS">Pass</option><option value="FAIL">Fail — closes this batch</option></select></div><div id="labelFields"><label id="labelCaption" for="label">Method or product name</label><input id="label" maxlength="160"></div><div id="massFields"><label for="grams">Output quantity (whole grams)</label><input id="grams" type="number" min="1" step="1"></div><label for="notes">Evidence notes and report/reference number</label><textarea id="notes" minlength="10" maxlength="6000" required></textarea><label for="pdf">Supporting PDF (up to 5 MB; required for a non-demo lab result)</label><input id="pdf" type="file" accept="application/pdf,.pdf"><label><input id="demo" type="checkbox"> This is a simulated test record, not a real test or physical operation.</label><label><input id="examined" type="checkbox" required> I checked the evidence and am authorized to record this outcome.</label></fieldset><button id="submit">Record on Fabric</button></form><h3>Ledger history</h3><pre id="history"></pre></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let token=null,uid=null,current=null,pending=null,busy=false;
const labels={LAB:'Lab result',PROCESS:'Processing',PACKAGE:'Packaging',DELIVER:'Delivery',RECALL:'Recall'};
function key(){return 'herbchain-operation:'+uid}function message(t){$('message').textContent=t}
function recovery(){ $('recovery').hidden=!pending;$('pendingInfo').textContent=pending?pending.batchId+' · request '+pending.requestId:'';$('fields').disabled=!!pending;$('submit').disabled=!!pending; }
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function guard(fn){if(busy)return;busy=true;try{await fn()}catch(e){message(e.message)}finally{busy=false}}
function fields(){const a=$('action').value;$('labFields').hidden=a!=='LAB';$('labelFields').hidden=!['PROCESS','PACKAGE'].includes(a);$('massFields').hidden=a!=='PROCESS';$('labelCaption').textContent=a==='PROCESS'?'Processing method':'Product name';}
async function loadBatch(id){current=await api('/api/lifecycle/'+encodeURIComponent(id.trim()));$('detail').hidden=false;$('title').textContent=current.batch.batchId;$('status').textContent=current.batch.status+' · '+current.batch.quantityGrams+' g · sequence '+current.batch.sequence+' · lab pass: '+(current.batch.labPassed?'yes':'no');$('history').textContent=JSON.stringify(current.events.map(e=>({type:e.type,sequence:e.sequence,details:e.details,transactionId:e.transactionId})),null,2);$('action').replaceChildren();for(const action of current.actions)$('action').add(new Option(labels[action],action));$('operation').hidden=!current.actions.length;$('availability').textContent=current.actions.length?'Complete the evidence for your operation.':'No operation is currently available to this account. Processing requires custody and a passing lab result; packaging requires processing and a new passing lab result. Resolve pending handoffs first.';fields();recovery()}
async function finish(r){if(r.committed){localStorage.removeItem(key());pending=null;recovery();$('operation').reset();await loadBatch(r.batchId);message('Recorded on Fabric: '+r.status+'\nTransaction: '+r.transactionId+'\nEvidence digest: '+r.evidenceHash)}else message('Commit not confirmed. Check or retry the saved request; do not create a replacement.\nTransaction: '+(r.transactionId||'not yet available'))}
async function send(payload){await finish(await api('/api/lifecycle/'+pending.batchId,{method:'POST',body:JSON.stringify(payload)}))}
function readPdf(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('Cannot read PDF'));reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(file)})}
$('login').onsubmit=e=>{e.preventDefault();guard(async()=>{const c=await fetch('/review-config').then(r=>r.json());const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Sign in failed');token=d.access_token;uid=d.user.id;$('password').value='';$('login').hidden=true;$('account').hidden=false;$('identity').textContent='Account ID: '+uid;pending=JSON.parse(localStorage.getItem(key())||'null');recovery();const me=await api('/api/me');$('identity').textContent=me.role+' · '+uid;message('Enter your batch ID to load the available actions.');})};
$('action').onchange=fields;$('load').onclick=()=>guard(()=>loadBatch($('batchId').value));$('retry').onclick=()=>guard(()=>send({requestId:pending.requestId}));
$('operation').onsubmit=e=>{e.preventDefault();guard(async()=>{if(pending)throw Error('Resolve the saved request first.');const a=$('action').value,p={requestId:crypto.randomUUID(),action:a,expectedSequence:current.batch.sequence,notes:$('notes').value,examined:$('examined').checked,demo:$('demo').checked};if(a==='LAB')p.outcome=$('outcome').value;if(['PROCESS','PACKAGE'].includes(a))p.label=$('label').value;if(a==='PROCESS')p.outputGrams=Number($('grams').value);const file=$('pdf').files[0];if(file){if(file.size>5*1024*1024)throw Error('PDF must be at most 5 MB');p.attachment=await readPdf(file)}if(a==='LAB'&&!p.demo&&!p.attachment)throw Error('Attach the actual lab PDF, or identify a simulated demo.');if(!confirm('Record '+labels[a]+(p.demo?' as a simulated demo':'')+' on Fabric?'+(a==='RECALL'||p.outcome==='FAIL'?' This closes the batch.':'')))return;const saved={batchId:current.batch.batchId,requestId:p.requestId};localStorage.setItem(key(),JSON.stringify(saved));pending=saved;recovery();await send(p);})};
$('clear').onclick=()=>guard(async()=>{await loadBatch(pending.batchId);if(!confirm('History refreshed. Clearing this local reference does not cancel a submitted transaction. Clear only after inspecting the result.'))return;localStorage.removeItem(key());pending=null;recovery();message('Local reference cleared. Check history before recording another operation.')});
$('logout').onclick=()=>{if(busy)return;token=null;uid=null;current=null;pending=null;$('login').hidden=false;for(const id of ['account','recovery','detail'])$(id).hidden=true;$('operation').reset();$('history').textContent='';message('Signed out of this page.')};
window.refreshDashboardToken=t=>{token=t;};
window.acceptDashboardSession=async s=>{token=s.access_token;uid=s.user.id;$('login').hidden=true;$('account').hidden=false;$('logout').hidden=true;const me=await api('/api/me');$('identity').textContent=me.role+' · '+uid;pending=JSON.parse(localStorage.getItem(key())||'null');recovery();const id=new URLSearchParams(location.search).get('batch');if(id){$('batchId').value=id;await loadBatch(id);}};
</script><script src="/session-bridge.js"></script></html>
