<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HerbChain custody</title>
<link rel="stylesheet" href="/workspace.css"><body class="custody">
<main><small>HERBCHAIN</small><h1>Receive or send herbs</h1><div class="guide"><h2>Keep every transfer clear</h2><p>The sender chooses a recipient. The recipient checks the herbs and quantity, then confirms receipt using their own account.</p></div>
<form id="login"><label for="email">Participant email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button>Sign in</button></p></form>
<p id="message" role="status" aria-live="polite"></p><section id="account" hidden><p id="accountId"></p><button id="logout">Sign out</button><button id="refresh">Refresh batches</button><h2>Choose a batch</h2><ul id="batches"></ul><details><summary>Find a batch by its number</summary><label for="lookup">Full batch number</label><input id="lookup" size="48"><button id="open">Find batch</button></details></section>
<section id="recovery" hidden><h2>Saved request</h2><p id="saved"></p><button id="retry">Check or retry saved request</button><button id="discard">Clear local retry reference</button></section>
<section id="detail" hidden><h2 id="title"></h2><p id="summary"></p><div id="propose" hidden><label for="recipient">Receiving participant</label><select id="recipient"></select><button id="send">Send transfer request</button></div><button id="accept" hidden>I received this batch</button><button id="cancel" hidden>Cancel transfer request</button><details><summary>Blockchain record details</summary><pre id="history"></pre></details></section></main>
<script src="/batch-language.js"></script><script>
const $=id=>document.getElementById(id);let token=null,uid=null,current=null,pending=null,busy=false;
function message(s){$('message').textContent=s}
function key(){return 'herbchain-custody-request:'+uid}
function recovery(){ $('recovery').hidden=!pending;$('saved').textContent=pending?pending.input.action+' · '+pending.batchId+' · '+pending.input.requestId:'' }
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function guard(fn){if(busy)return;busy=true;try{await fn()}catch(e){message(e.message)}finally{busy=false}}
async function queue(){const d=await api('/api/custody');$('batches').replaceChildren();for(const b of d.batches){const li=document.createElement('li'),btn=document.createElement('button');const title=document.createElement('strong'),caption=document.createElement('span');title.textContent=HerbLanguage.event(b.species)+' · '+HerbLanguage.mass(b.quantityGrams);caption.textContent=HerbLanguage.status(b.status)+(b.incoming?' · Ready to receive':b.outgoing?' · Waiting for recipient':'');btn.append(title,caption);btn.onclick=()=>guard(()=>openBatch(b.batchId));li.append(btn);$('batches').append(li)}if(!d.batches.length)$('batches').textContent='No batches are assigned to you yet. Ask the sender to choose your account, then refresh.';if(d.warnings.length)message(d.warnings.join('\n'))}
async function openBatch(id){const d=await api('/api/custody/'+encodeURIComponent(id.trim()));current=d;$('detail').hidden=false;$('title').textContent=HerbLanguage.event(d.batch.species);$('summary').textContent=HerbLanguage.mass(d.batch.quantityGrams)+' · '+HerbLanguage.status(d.batch.status);$('propose').hidden=!d.actions.propose;$('accept').hidden=!d.actions.accept;$('cancel').hidden=!d.actions.cancel;$('history').textContent=JSON.stringify(d.events.map(e=>({type:e.type,sequence:e.sequence,transactionId:e.transactionId})),null,2)}
async function submitSaved(){if(!pending)return;const r=await api('/api/custody/'+encodeURIComponent(pending.batchId),{method:'POST',body:JSON.stringify(pending.input)});if(r.committed){localStorage.removeItem(key());pending=null;recovery();await queue();await openBatch(r.batchId);message('Transfer update recorded.\nTransaction: '+r.transactionId)}else message('Commit not yet confirmed. Use the saved request button to check or retry.\nTransaction: '+(r.transactionId||'not available'))}
async function action(action){if(pending)throw Error('Resolve the saved request before starting another handoff.');if(!current)throw Error('Open a batch first.');if(action==='PROPOSE'&&!$('recipient').value)throw Error('Choose an enrolled recipient.');if(!confirm(action==='ACCEPT'?'Confirm that you received this batch and accept custody?':action==='PROPOSE'?'Send this batch to '+$('recipient').selectedOptions[0].text+'? They must confirm receipt before responsibility transfers.':'Cancel this pending transfer request?'))return;const candidate={batchId:current.batch.batchId,input:{action,requestId:crypto.randomUUID(),expectedSequence:current.batch.sequence,...(action==='PROPOSE'?{recipientUid:$('recipient').value}:{})}};localStorage.setItem(key(),JSON.stringify(candidate));pending=candidate;recovery();await submitSaved()}
$('login').onsubmit=e=>{e.preventDefault();guard(async()=>{const c=await fetch('/review-config').then(r=>r.json());const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anonKey},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Sign in failed');token=d.access_token;uid=d.user.id;$('password').value='';$('login').hidden=true;$('account').hidden=false;$('accountId').textContent='Signed in to your participant account';pending=JSON.parse(localStorage.getItem(key())||'null');recovery();const directory=await api('/api/custody/participants');$('recipient').replaceChildren(new Option('Choose recipient',''));for(const p of directory.participants.filter(p=>p.uid!==uid))$('recipient').add(new Option(p.name+' · '+HerbLanguage.role(p.role),p.uid));await queue();message(pending?'A saved request was recovered. Check or retry it before starting another action.':'Choose a batch to receive it or send it to the next participant.');})};
$('refresh').onclick=()=>guard(queue);$('open').onclick=()=>guard(()=>openBatch($('lookup').value));$('send').onclick=()=>guard(()=>action('PROPOSE'));$('accept').onclick=()=>guard(()=>action('ACCEPT'));$('cancel').onclick=()=>guard(()=>action('CANCEL'));$('retry').onclick=()=>guard(submitSaved);
$('discard').onclick=()=>guard(async()=>{if(!pending)return;await openBatch(pending.batchId);if(!confirm('Inspect the refreshed ledger history first. Clearing this local reference does not cancel any submitted transaction. Clear it?'))return;localStorage.removeItem(key());pending=null;recovery();message('Local retry reference cleared. Ledger history was refreshed; inspect it before starting a new action.')});
$('logout').onclick=()=>{if(busy)return;token=null;uid=null;current=null;pending=null;$('login').hidden=false;for(const id of ['account','detail','recovery'])$(id).hidden=true;$('history').textContent='';message('Signed out. Any saved request can be recovered when this account signs in again.')};
window.refreshDashboardToken=t=>{token=t;};
window.acceptDashboardSession=async s=>{document.body.classList.add('embedded');token=s.access_token;uid=s.user.id;$('login').hidden=true;$('account').hidden=false;$('logout').hidden=true;$('accountId').textContent='Signed in to your participant account';pending=JSON.parse(localStorage.getItem(key())||'null');recovery();const d=await api('/api/custody/participants');$('recipient').replaceChildren(new Option('Choose recipient',''));for(const p of d.participants.filter(p=>p.uid!==uid))$('recipient').add(new Option(p.name+' · '+HerbLanguage.role(p.role),p.uid));await queue();const id=new URLSearchParams(location.search).get('batch');if(id){$('lookup').value=id;await openBatch(id);}};
</script><script src="/session-bridge.js"></script></html>
