<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset HerbChain password</title>
<style>body{font:17px system-ui;background:#f5f7f0;color:#183d2b}main{max-width:520px;margin:60px auto;padding:24px}label{display:block;margin:18px 0 6px}input,button{font:inherit;padding:12px;border-radius:8px;box-sizing:border-box;width:100%}button{margin-top:22px;background:#183d2b;color:white;cursor:pointer}#message{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}</style>
<main><h1>Reset your password</h1><p id="message" role="status">Checking your recovery link…</p><form id="form" hidden><p id="account"></p><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="submit">Save new password</button></form><p><a href="/custody">Return to participant sign in</a></p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let accessToken=null,config=null,busy=false;
async function initialize(){
 const fragment=new URLSearchParams(location.hash.slice(1));
 // Remove credentials from the address bar; keep only the access token in memory.
 history.replaceState(null,'',location.pathname);
 if(fragment.get('error'))throw Error('This recovery link is invalid or expired. Request a fresh recovery email.');
 if(fragment.get('type')!=='recovery'||!fragment.get('access_token'))throw Error('Open this page using the recovery link from your email. The link must include its recovery fragment.');
 accessToken=fragment.get('access_token');
 const response=await fetch('/review-config',{cache:'no-store'});if(!response.ok)throw Error('Cannot load authentication settings.');config=await response.json();
 const r=await fetch(config.url+'/auth/v1/user',{headers:{apikey:config.anonKey,Authorization:'Bearer '+accessToken},cache:'no-store'});
 if(!r.ok){accessToken=null;throw Error('Your recovery session is invalid or expired. Request a fresh recovery email.');}
 const user=await r.json();$('account').textContent='Account: '+user.email;$('form').hidden=false;$('message').textContent='Choose a new password for this account.';
}
$('form').onsubmit=async event=>{
 event.preventDefault();if(busy||!accessToken)return;
 if(!$('form').reportValidity())return;
 if($('password').value!==$('confirm').value){$('message').textContent='The passwords do not match.';return;}
 busy=true;$('submit').disabled=true;
 try{
  const r=await fetch(config.url+'/auth/v1/user',{method:'PUT',headers:{apikey:config.anonKey,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});
  const data=await r.json();if(!r.ok)throw Error(data.msg||data.message||'Password update failed. The link may have expired.');
  accessToken=null;$('password').value='';$('confirm').value='';$('form').hidden=true;$('message').textContent='Password updated. Return to participant sign in and use your new password.';
 }catch(e){$('message').textContent=e.message+' If the connection failed after submission, try signing in with your new password before retrying.';}
 finally{busy=false;$('submit').disabled=false;}
};
initialize().catch(e=>{$('message').textContent=e.message;});
</script></html>
