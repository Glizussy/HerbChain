<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your activity · HerbChain</title><link rel="stylesheet" href="/workspace.css"><main><a href="/dashboard">← Your batches</a><h1>Your activity</h1><p>See what is waiting, what was recorded, and what needs attention.</p><form id="login"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><section id="account" hidden><button id="refresh">Check updates</button> <button id="logout">Sign out</button><p>Showing your latest 50 requests. No need to submit a waiting request again.</p><div id="items"></div></section><p id="message" role="status" aria-live="polite"></p></main><script>
let token=null;const $=id=>document.getElementById(id),labels={queued:'Waiting to be processed',running:'Being recorded',reconcile:'Checking the ledger — please wait',completed:'Recorded on Fabric',rejected:'Needs attention'};
async function load(){const original=token;try{const r=await fetch('/api/jobs',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(token!==original)return;if(!r.ok)throw Error(d.error||'Unable to load activity');$('items').replaceChildren();$('message').textContent=d.enabled?'':'Background processing is not enabled yet.';for(const job of d.jobs){const card=document.createElement('article');card.className='card';for(const text of [labels[job.state]||job.state,job.operation+' · '+job.batchId,new Date(job.createdAt).toLocaleString(),job.result?.reason||'']){const p=document.createElement('p');p.textContent=text;card.append(p)}if(job.state==='rejected'){const button=document.createElement('button');button.textContent='Retry this request';button.onclick=async()=>{if(!confirm('Retry this exact request? If the batch changed, return to your batches and create a fresh action instead.'))return;button.disabled=true;try{const r=await fetch('/api/jobs/'+job.id+'/retry',{method:'POST',headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Request cannot be retried');await load()}catch(e){$('message').textContent=e.message;button.disabled=false}};card.append(button)}$('items').append(card)}if(d.enabled&&!d.jobs.length)$('message').textContent='No requests yet.';}catch(e){$('message').textContent=e.message}}
$('login').onsubmit=async e=>{e.preventDefault();try{const c=await fetch('/review-config').then(r=>r.json());const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error('Sign in failed');$('password').value='';await window.acceptDashboardSession(d);}catch(e){$('message').textContent=e.message}};
window.acceptDashboardSession=async s=>{token=s.access_token;$('login').hidden=true;$('account').hidden=false;await load()};window.refreshDashboardToken=t=>{token=t};$('refresh').onclick=load;$('logout').onclick=()=>{token=null;$('items').replaceChildren();$('account').hidden=true;$('login').hidden=false};
</script><script src="/session-bridge.js"></script></html>
