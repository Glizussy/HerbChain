<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage lots · HerbChain</title><link rel="stylesheet" href="/workspace.css"><main><h1>Divide or combine herbs</h1><p>Use this only for herbs you currently hold. New lots need fresh quality checks.</p><p id="message" role="status"></p><section id="account" hidden><form id="load"><label>Source batch number<input id="batch" required></label><button>Check source</button></form><p id="source"></p><details><summary>Related lots</summary><div id="lineage"></div></details><form id="form" hidden><label>What do you want to do?<select id="action"><option value="SPLIT">Divide into two lots</option><option value="MERGE">Combine with another lot</option></select></label><div id="split"><label>First lot weight (grams)<input id="grams1" type="number" min="1" step="1"></label><label>Second lot weight (grams)<input id="grams2" type="number" min="1" step="1"></label></div><div id="merge" hidden><label>Second source batch number<input id="second"></label></div><label>Measured loss (grams)<input id="loss" type="number" min="0" step="1" value="0" required></label><label>Explain the operation<textarea id="notes" minlength="10" maxlength="4000" required></textarea></label><button>Review and send</button></form><button id="retry" hidden>Check saved request</button></section><p id="hint">Open this page from your signed-in batch dashboard.</p><a href="/dashboard">Back to batches</a></main><script>
const $=id=>document.getElementById(id);let token,uid,current,pending;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function guard(fn){try{await fn()}catch(e){$('message').textContent=e.message}}
function key(){return 'hc-lot-request:'+uid}function restore(){pending=JSON.parse(localStorage.getItem(key())||'null');$('retry').hidden=!pending;$('form').hidden=!!pending||!current}
async function send(){const d=await api('/api/lots/'+encodeURIComponent(pending.batchId),pending.input);$('message').textContent=d.committed?'Recorded. Refresh your batches to find the new lots.':d.queueState==='rejected'?'This request was rejected. Check your activity, then reload the source before trying again.':'Saved. Check your activity for the outcome.';if(d.committed||d.queueState==='rejected'){localStorage.removeItem(key());current=null;restore()}}
window.acceptDashboardSession=async s=>{token=s.access_token;uid=s.user.id;current=null;$('account').hidden=false;$('hint').hidden=true;restore();const id=new URLSearchParams(location.search).get('batch');if(id)$('batch').value=id};window.refreshDashboardToken=t=>token=t;
$('load').onsubmit=e=>{e.preventDefault();guard(async()=>{current=(await api('/api/batches/'+encodeURIComponent($('batch').value.trim()))).batch;const lineage=await api('/api/lots/'+encodeURIComponent(current.batchId));$('lineage').replaceChildren();for(const lot of lineage.descendants){const p=document.createElement('p');p.textContent=lot.batchId+' · '+lot.status+' · '+lot.quantityGrams+' g';$('lineage').append(p)}if(lineage.blockedBy.length)throw Error('A source lot was recalled. Contact your supervisor.');$('source').textContent=current.species+' · '+current.quantityGrams+' grams · '+current.status;restore()})};
$('action').onchange=()=>{$('split').hidden=$('action').value!=='SPLIT';$('merge').hidden=$('action').value!=='MERGE'};
$('form').onsubmit=e=>{e.preventDefault();guard(async()=>{if(pending)throw Error('Check your saved request first');const p={requestId:crypto.randomUUID(),action:$('action').value,notes:$('notes').value,lossGrams:Number($('loss').value),expectedSequence:current.sequence};if(p.action==='SPLIT'){p.outputs=[{batchId:'LOT-'+crypto.randomUUID(),quantityGrams:Number($('grams1').value)},{batchId:'LOT-'+crypto.randomUUID(),quantityGrams:Number($('grams2').value)}];if(p.outputs[0].quantityGrams+p.outputs[1].quantityGrams+p.lossGrams!==current.quantityGrams)throw Error('The two lot weights plus measured loss must equal the source weight.')}else{const other=(await api('/api/batches/'+encodeURIComponent($('second').value.trim()))).batch;p.inputs=[{batchId:current.batchId,expectedSequence:current.sequence},{batchId:other.batchId,expectedSequence:other.sequence}];p.outputId='LOT-'+crypto.randomUUID()}if(!confirm('This consumes the source lot(s) and creates new lots requiring quality checks. Continue?'))return;pending={batchId:current.batchId,input:p};localStorage.setItem(key(),JSON.stringify(pending));restore();await send()})};$('retry').onclick=()=>guard(send);
</script><script src="/session-bridge.js"></script></html>
