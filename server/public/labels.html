<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HerbChain batch label</title><style>body{font:17px system-ui;color:#173d30;background:#f4f6ee}main{max-width:650px;margin:40px auto;padding:24px}article{background:white;border:1px solid #b6c8ac;padding:28px;border-radius:16px;overflow-wrap:anywhere}img{width:240px;max-width:100%;display:block}button{padding:12px;font:inherit;margin-top:20px}#demo{font-weight:bold}#message{white-space:pre-wrap}@media print{body{background:white}button,nav,#message{display:none}main{margin:0}}</style><main><nav><a href="/dashboard">Participant workspace</a></nav><h1>Product trace label</h1><p id="message" role="status"></p><article id="label" hidden><h2 id="name"></h2><p id="demo"></p><p id="status"></p><p id="batch"></p><img id="qr" alt="QR code linking to this batch's public trace"><a id="trace">Open consumer trace</a><p id="url"></p></article><button id="print" hidden>Print label</button></main><script>
const id=new URLSearchParams(location.search).get('batch');
(async()=>{try{if(!id||!/^[A-Za-z0-9_-]{1,80}$/.test(id))throw Error('Open a label from a packaged batch in the dashboard.');const r=await fetch('/public/batches/'+id);const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('name').textContent=d.productName;document.getElementById('batch').textContent=d.batchId;document.getElementById('status').textContent=d.quantityGrams+' g · '+d.status;document.getElementById('demo').textContent=d.demoStatus==='SIMULATED'?'SIMULATED DEMO — not evidence of real testing':d.demoStatus==='UNKNOWN'?'Demo status unavailable':'No demo flag in available evidence';document.getElementById('qr').src='/public/batches/'+id+'/qr.svg';document.getElementById('trace').href='/trace?batch='+encodeURIComponent(id);document.getElementById('url').textContent=d.traceUrl;document.getElementById('message').textContent=d.publicUrlConfigured?'Verify this QR opens on the intended phone before distributing labels.':'LOCAL PREVIEW: this QR points to the development computer. Configure HERBCHAIN_PUBLIC_URL to a reachable HTTPS address before distributing labels.';document.getElementById('label').hidden=false;document.getElementById('print').hidden=false;}catch(e){document.getElementById('message').textContent=e.message;}})();document.getElementById('print').onclick=()=>window.print();
</script></html>
